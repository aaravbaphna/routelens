<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouteLens</title>
  <meta name="description" content="Why LiteLLM picked each model, on every turn.">
  <link rel="icon" type="image/svg+xml" href="/routelens/assets/logo.svg">
  <link rel="stylesheet" href="/routelens/assets/style.css">
  <script>
    try {
      var q = /[?&]theme=(light|dark)/.exec(location.search);
      var t = q ? q[1] : localStorage.getItem("routelens-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="tip" role="tooltip" hidden></div>
  <script src="/routelens/assets/app.js" defer></script>
</body>
</html>
